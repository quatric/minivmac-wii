name: Build

on:
  push:
    # With only a tags filter GitHub skips branch pushes, so list both.
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The in-app updaters (libwiiupdate, libwiiuupdate) check the releases of
  # the repository they were built from: the Plus on this one, the II on
  # <this one>-ii. Each release carries the Wii and the Wii U zip.
  UPDATE_OWNER: ${{ github.repository_owner }}
  UPDATE_REPO: ${{ github.event.repository.name }}

jobs:
  wii:
    runs-on: ubuntu-24.04
    container: devkitpro/devkitppc:latest
    strategy:
      fail-fast: false
      matrix:
        model: [Plus, II]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install zip
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
      - name: Build and package
        shell: bash
        run: |
          args=(MODEL=${{ matrix.model }} UPDATE_OWNER="$UPDATE_OWNER" UPDATE_REPO="$UPDATE_REPO")
          # A v1.2.0 tag builds version 1.2.0, which the updater compares with newer tags.
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            args+=(VERSION="${GITHUB_REF_NAME#v}")
          fi
          make -C wii -j"$(nproc)" "${args[@]}"
          make -C wii "${args[@]}" dist-model
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.model }}
          if-no-files-found: error
          path: wii/dist/*.zip

  wiiu:
    runs-on: ubuntu-24.04
    container: devkitpro/devkitppc:latest
    strategy:
      fail-fast: false
      matrix:
        model: [Plus, II]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install zip and wiiu-sdl2
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
          # the image usually ships it already
          dkp-pacman -Q wiiu-sdl2 || dkp-pacman -Sy --noconfirm --needed wiiu-sdl2
      - name: Build and package
        shell: bash
        run: |
          args=(MODEL=${{ matrix.model }} UPDATE_OWNER="$UPDATE_OWNER" UPDATE_REPO="$UPDATE_REPO")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            args+=(VERSION="${GITHUB_REF_NAME#v}")
          fi
          make -C wiiu libs
          make -C wiiu -j"$(nproc)" "${args[@]}"
          make -C wiiu "${args[@]}" dist-model
      - uses: actions/upload-artifact@v7
        with:
          name: release-wiiu-${{ matrix.model }}
          if-no-files-found: error
          path: wiiu/dist/*.zip

  # Every push (or manual run) on the default branch refreshes the "latest"
  # release (the updater ignores that tag); v* tags get their own release.
  release:
    needs: [wii, wiiu]
    # pushes and manual runs on the default branch, and v* tags
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    env:
      # Optional: a token with contents:write on <owner>/<repo>-ii, so the
      # Macintosh II build is released where its updater looks.
      II_TOKEN: ${{ secrets.II_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - name: Move the latest tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Mini vMac Wii (latest)
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Latest build of Mini vMac Wii from ${{ github.sha }}.

            Wii: extract MinivMacWii-*-hbc.zip (Macintosh Plus, needs vMac.ROM) and/or MinivMacWiiII-*-hbc.zip (Macintosh II, needs MacII.ROM) to the root of your SD card or USB drive, put the ROM in the app's folder and open it from the Homebrew Channel.

            Wii U (Aroma): extract MinivMacWiiU-*-wiiu.zip and/or MinivMacWiiUII-*-wiiu.zip to the root of your SD card, put the ROM in sd:/wiiu/apps/MinivMacWiiU/ (or MinivMacWiiUII) and open it from the Wii U Menu.
          files: out/*.zip
      # Only the Plus zip goes on this repository's version releases: the
      # updater installs the first app folder of the zip it picks.
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Mini vMac Wii ${{ github.ref_name }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Wii: extract MinivMacWii-*-hbc.zip to the root of your SD card or USB drive, put vMac.ROM in sd:/apps/MinivMacWii/ and open Mini vMac Wii from the Homebrew Channel.

            Wii U (Aroma): extract MinivMacWiiU-*-wiiu.zip to the root of your SD card, put vMac.ROM in sd:/wiiu/apps/MinivMacWiiU/ and open Mini vMac Wii U from the Wii U Menu.
          files: |
            out/MinivMacWii-*-hbc.zip
            out/MinivMacWiiU-*-wiiu.zip
      - name: Publish tagged Macintosh II release
        if: github.ref_type == 'tag' && env.II_TOKEN != ''
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ github.repository }}-ii
          token: ${{ env.II_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Mini vMac Wii II ${{ github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Built from ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}.

            Wii: extract MinivMacWiiII-*-hbc.zip to the root of your SD card or USB drive, put MacII.ROM in sd:/apps/MinivMacWiiII/ and open Mini vMac Wii II from the Homebrew Channel.

            Wii U (Aroma): extract MinivMacWiiUII-*-wiiu.zip to the root of your SD card, put MacII.ROM in sd:/wiiu/apps/MinivMacWiiUII/ and open Mini vMac Wii U II from the Wii U Menu.
          files: |
            out/MinivMacWiiII-*-hbc.zip
            out/MinivMacWiiUII-*-wiiu.zip
