name: Build

on:
  push:
    # With only a tags filter GitHub skips branch pushes, so list both.
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The in-app updaters (libwiiupdate, libwiiuupdate) check the releases of
  # the repository they were built from: the Wii app (every model) and the
  # Wii U Plus on this one, the Wii U II on <this one>-ii.
  UPDATE_OWNER: ${{ github.repository_owner }}
  UPDATE_REPO: ${{ github.event.repository.name }}

jobs:
  # one Wii app with every model (wii/models.h)
  wii:
    runs-on: ubuntu-24.04
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install zip
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
      - name: Build and package
        shell: bash
        run: |
          args=(UPDATE_OWNER="$UPDATE_OWNER" UPDATE_REPO="$UPDATE_REPO")
          # A v1.2.0 tag builds version 1.2.0, which the updater compares with newer tags.
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            args+=(VERSION="${GITHUB_REF_NAME#v}")
          fi
          make -C wii libs
          make -C wii -j"$(nproc)" "${args[@]}"
          make -C wii "${args[@]}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-wii
          if-no-files-found: error
          path: wii/dist/*.zip

  wiiu:
    runs-on: ubuntu-24.04
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install zip and wiiu-sdl2
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends zip
          # the image usually ships it already
          dkp-pacman -Q wiiu-sdl2 || dkp-pacman -Sy --noconfirm --needed wiiu-sdl2
      - name: Build and package
        shell: bash
        run: |
          args=(UPDATE_OWNER="$UPDATE_OWNER" UPDATE_REPO="$UPDATE_REPO")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            args+=(VERSION="${GITHUB_REF_NAME#v}")
          fi
          make -C wiiu libs
          make -C wiiu -j"$(nproc)" "${args[@]}"
          make -C wiiu "${args[@]}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-wiiu
          if-no-files-found: error
          path: wiiu/dist/*.zip

  # Every push (or manual run) on the default branch refreshes the "latest"
  # release (the updater ignores that tag); v* tags get their own release.
  release:
    needs: [wii, wiiu]
    # pushes and manual runs on the default branch, and v* tags
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      # Setup instructions for the release page: .github/RELEASE_NOTES.md
      # with the version filled in (and, for latest, the commit it is from).
      - name: Write release notes
        run: |
          ver=$(basename out/MinivMacWii-*-hbc.zip | sed -e 's/^MinivMacWii-//' -e 's/-hbc\.zip$//')
          {
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              echo "Latest build ($ver) of ${GITHUB_SHA::7}, rebuilt on every push. Tagged versions are under [Releases](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases)."
              echo
            fi
            sed "s/<version>/$ver/g" .github/RELEASE_NOTES.md
          } > notes.md
      # Start the latest release afresh so files a build no longer makes
      # do not linger on it.
      - name: Move the latest tag
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes -R "$GITHUB_REPOSITORY" || true
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Mini vMac Wii (latest)
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body_path: notes.md
          files: out/*.zip
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Mini vMac Wii ${{ github.ref_name }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: notes.md
          files: |
            out/MinivMacWii-*-hbc.zip
            out/MinivMacWiiU-*-wiiu.zip
